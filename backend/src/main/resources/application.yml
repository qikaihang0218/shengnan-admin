server:
  port: 8082

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shengnan_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SP_DB_USERNAME:root}
    password: ${SP_DB_PASSWORD:admin}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 平台自定义配置
platform:
  jwt:
    secret: ${SP_JWT_SECRET:shengnan-platform-jwt-secret-2026-please-change-in-production}
    expiration-hours: 24
  cookie:
    # 本地 http 调试保持 false；正式部署启用 HTTPS 后务必改为 true
    secure: false
    # Lax 可拦截绝大多数跨站写请求（CSRF），同时不影响站内跳转携带 Cookie
    same-site: Lax
  upload:
    dir: ./uploads
  job:
    script-timeout-seconds: 300
  # 自定义 SQL：改脚本不用改代码、不用重编译，重启后自动执行
  sql:
    # 总开关，生产可设为 false 关掉自动执行
    enabled: true
    # 外部脚本目录（相对启动目录），支持多个候选，逗号分隔；改完重启即生效
    script-dir: ./sql,../sql
    # 内置脚本目录（打进 jar），一般放随代码发布的基础脚本
    classpath-dir: sql/migration
    # 已执行过的脚本内容被改动时是否中断启动（true 更安全，防止静默漏执行）
    fail-on-checksum-mismatch: true
    # 任一脚本失败是否中断启动
    fail-fast: true

logging:
  level:
    com.shengnan.platform: info
